spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:directfile_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
  liquibase:
    user: sa
    password:

aws:
  enabled: false
  default-credentials-provider-chain-enabled: false
  crypto-cache:
    message-use-limit: 10
    max-age-seconds: 10
    max-items: 10
